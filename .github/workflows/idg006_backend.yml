name: IDG006_BACKEND Notify

on:
  push:
    branches:
      - main
      - develop

jobs:
  notify-push:
    runs-on: ubuntu-latest
    steps:
      - name: Send Push Notification to Telegram
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{
              "chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}",
              "parse_mode": "HTML",
              "text": "🔔 <b>មានការផ្លាស់ប្ដូរ Code ថ្មី</b>\n👤 <b>Author:</b> ${{ github.actor }}\n📦 <b>Repo:</b> ${{ github.repository }}\n🌿 <b>Branch:</b> ${{ github.ref_name }}\n💬 <b>Commit:</b> ${{ github.event.head_commit.message }}\n🔗 <a href=\"${{ github.event.head_commit.url }}\">View Commit</a>"
            }'

  build:
    runs-on: ubuntu-latest
    needs: notify-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Placeholder build step
        run: echo "Replace this with your actual build/test commands"

      - name: Notify Success
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{
              "chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}",
              "parse_mode": "HTML",
              "text": "✅ <b>Build ជោគជ័យ!</b>\n📦 <b>Repo:</b> ${{ github.repository }}\n🌿 <b>Branch:</b> ${{ github.ref_name }}\n👤 <b>Triggered by:</b> ${{ github.actor }}"
            }'

      - name: Notify Failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{
              "chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}",
              "parse_mode": "HTML",
              "text": "❌ <b>Build បរាជ័យ!</b>\n📦 <b>Repo:</b> ${{ github.repository }}\n🌿 <b>Branch:</b> ${{ github.ref_name }}\n👤 <b>Triggered by:</b> ${{ github.actor }}\n🔗 <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">មើលលម្អិត</a>"
            }'
name: IDG006_BACKEND Notify

on:
  push:
    branches:
      - main
      - develop

jobs:
  notify-push:
    runs-on: ubuntu-latest
    steps:
      - name: Send Push Notification to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMPARE_URL: ${{ github.event.compare }}
        run: |
          TEXT=$(jq -rn '
            def esc: gsub("&";"&amp;") | gsub("<";"&lt;") | gsub(">";"&gt;");
            ($ENV.COMMITS_JSON | fromjson) as $c |
            ($c | reverse | .[0:15] | map(
                "• <a href=\"" + .url + "\">" + (.id[0:7]) + "</a> "
                + ((.message | split("\n")[0]) | esc)
                + " — " + ((.author.name // "unknown") | esc)
              ) | join("\n")) as $list |
            "🔔 <b>មានការផ្លាស់ប្ដូរ Code ថ្មី</b>\n"
            + "👤 <b>Pusher:</b> " + ($ENV.ACTOR | esc) + "\n"
            + "📦 <b>Repo:</b> " + ($ENV.REPO | esc) + "\n"
            + "🌿 <b>Branch:</b> " + ($ENV.BRANCH | esc) + "\n"
            + "💬 <b>Commits (" + ($c | length | tostring) + "):</b>\n"
            + (if ($c | length) == 0 then "<i>(no commits)</i>" else $list end)
            + (if ($c | length) > 15 then "\n… និង " + (($c|length)-15|tostring) + " ទៀត" else "" end)
            + "\n🔗 <a href=\"" + $ENV.COMPARE_URL + "\">View changes</a>"
          ')

          jq -n --arg chat_id "$CHAT_ID" --arg text "$TEXT" \
            '{chat_id:$chat_id, parse_mode:"HTML", disable_web_page_preview:true, text:$text}' \
          | curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              --data @-

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Placeholder build step
        run: echo "Replace this with your actual build/test commands"

      - name: Notify Success
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          TEXT="✅ <b>Build ជោគជ័យ!</b>
          📦 <b>Repo:</b> ${REPO}
          🌿 <b>Branch:</b> ${BRANCH}
          👤 <b>Triggered by:</b> ${ACTOR}"
          jq -n --arg chat_id "$CHAT_ID" --arg text "$TEXT" \
            '{chat_id:$chat_id, parse_mode:"HTML", text:$text}' \
          | curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" --data @-

      - name: Notify Failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TEXT="❌ <b>Build បរាជ័យ!</b>
          📦 <b>Repo:</b> ${REPO}
          🌿 <b>Branch:</b> ${BRANCH}
          👤 <b>Triggered by:</b> ${ACTOR}
          🔗 <a href=\"${RUN_URL}\">មើលលម្អិត</a>"
          jq -n --arg chat_id "$CHAT_ID" --arg text "$TEXT" \
            '{chat_id:$chat_id, parse_mode:"HTML", text:$text}' \
          | curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" --data @-
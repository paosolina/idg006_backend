name: IDG006_BACKEND Notify

on:
  push:
    branches:
      - main
      - develop

jobs:
  notify-push:
    runs-on: ubuntu-latest
    steps:
      - name: Send Push Notification to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMPARE_URL: ${{ github.event.compare }}
        run: |
          TEXT=$(jq -rn '
            def esc: gsub("&";"&amp;") | gsub("<";"&lt;") | gsub(">";"&gt;");
            ($ENV.COMMITS_JSON | fromjson) as $c |
            ($c | reverse | .[0:15] | map(
                "• <a href=\"" + .url + "\">" + (.id[0:7]) + "</a> "
                + ((.message | split("\n")[0]) | esc)
                + " — " + ((.author.name // "unknown") | esc)
              ) | join("\n")) as $list |
            "🔔 <b>មានការផ្លាស់ប្ដូរ Code ថ្មី</b>\n"
            + "👤 <b>Pusher:</b> " + ($ENV.ACTOR | esc) + "\n"
            + "📦 <b>Repo:</b> " + ($ENV.REPO | esc) + "\n"
            + "🌿 <b>Branch:</b> " + ($ENV.BRANCH | esc) + "\n"
            + "💬 <b>Commits (" + ($c | length | tostring) + "):</b>\n"
            + (if ($c | length) == 0 then "<i>(no commits)</i>" else $list end)
            + (if ($c | length) > 15 then "\n… និង " + (($c|length)-15|tostring) + " ទៀត" else "" end)
            + "\n🔗 <a href=\"" + $ENV.COMPARE_URL + "\">View changes</a>"
          ')

          jq -n --arg chat_id "$CHAT_ID" --arg text